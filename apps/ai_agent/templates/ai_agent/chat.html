{% extends "base.html" %}
{% block title %}AI Assistant - Smart Clinic{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">🤖 Smart Clinic Assistant</h5>
                <small>Ask me to search doctors, book, view or cancel your appointments.</small>
            </div>

            <div id="chat-box" class="card-body" style="height: 420px; overflow-y: auto; background:#f8f9fa;"></div>

            <div id="typing-indicator" class="px-3 text-muted small d-none">Assistant is typing...</div>

            <div class="card-footer bg-white">
                <form id="chat-form" class="d-flex gap-2">
                    <input type="text" id="user-input" class="form-control" placeholder="e.g. Show me my appointments" autocomplete="off">
                    <button type="submit" class="btn btn-primary">Send</button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; margin-bottom: 10px; }
.msg-user { background: #0d6efd; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
.msg-bot { background: #e9ecef; color: #212529; margin-right: auto; border-bottom-left-radius: 4px; }
</style>

<script>
function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
}

const chatBox = document.getElementById('chat-box');
const form = document.getElementById('chat-form');
const input = document.getElementById('user-input');
const typing = document.getElementById('typing-indicator');

function addMessage(text, sender) {
    const bubble = document.createElement('div');
    bubble.className = `msg-bubble ${sender === 'user' ? 'msg-user' : 'msg-bot'}`;
    bubble.textContent = text;
    chatBox.appendChild(bubble);
    chatBox.scrollTop = chatBox.scrollHeight;
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    input.value = '';
    typing.classList.remove('d-none');

    try {
        const response = await fetch("{% url 'chat_api' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
            },
            body: JSON.stringify({ message: message }),
        });
        const data = await response.json();
        typing.classList.add('d-none');
        addMessage(data.reply, 'bot');
    } catch (err) {
        typing.classList.add('d-none');
        addMessage("Sorry, something went wrong connecting to the assistant.", 'bot');
    }
});
</script>
{% endblock %}
