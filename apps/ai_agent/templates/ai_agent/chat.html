<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clinic AI Assistant</title>
</head>
<body>
    <h1>Smart Clinic Assistant</h1>
    <a href="{% url 'home' %}">Home</a>
    <div id="chat-box" style="border:1px solid #ccc; height:300px; overflow-y:auto; padding:10px; margin:10px 0;"></div>
    <input type="text" id="user-input" placeholder="Ask about your appointments..." style="width:70%;">
    <button onclick="sendMessage()">Send</button>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value;
            if (!message) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<p><strong>You:</strong> ${message}</p>`;
            input.value = '';

            const response = await fetch("{% url 'chat_api' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ message: message }),
            });
            const data = await response.json();
            chatBox.innerHTML += `<p><strong>Assistant:</strong> ${data.reply}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
