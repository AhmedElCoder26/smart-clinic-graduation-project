{% extends "base.html" %}
{% block title %}Book Appointment - Smart Clinic{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title mb-1">Book Appointment</h4>
                <p class="text-muted mb-4">with Dr. {{ doctor.user.get_full_name|default:doctor.user.username }} &middot; {{ doctor.specialization.name }}</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Time</label>
                        <input type="time" name="time" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes (optional)</label>
                        <textarea name="notes" class="form-control" rows="3" placeholder="Reason for visit..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Confirm Booking</button>
                </form>
                <a href="{% url 'doctor_list' %}" class="d-block text-center mt-3">Back to Doctors</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
